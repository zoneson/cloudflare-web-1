<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a Style</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; padding: 24px 16px 48px; background: #e9ebef; color: #111; font: 16px/1.5 system-ui, sans-serif; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .intro { margin: 0 0 28px; color: #555; }
    .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 28px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 10px; }
    figcaption strong { font-size: 1.15rem; }
    figcaption span { display: block; color: #555; font-size: .92rem; }
    .phone { width: 100%; max-width: 390px; height: 720px; border: 10px solid #1b1d22; border-radius: 34px; background: #fff; overflow: hidden; }
    .phone iframe { width: 100%; height: 100%; border: 0; }
    .open { display: inline-block; margin-top: 10px; font-weight: 600; color: #2563eb; }
  </style>
</head>
<body>
  <h1>Pick a style</h1>
  <p class="intro">Same words, three different looks. Each frame shows how it looks on a phone —
    tap “open full page” to see it on a big screen.</p>

  <div class="options">
    <figure>
      <figcaption><strong>A · Clean</strong><span>White and calm, one blue accent. Feels professional and trustworthy.</span></figcaption>
      <div class="phone"><iframe src="/?style=clean" title="Clean style preview" loading="lazy"></iframe></div>
      <a class="open" href="/?style=clean" target="_blank">Open full page →</a>
    </figure>
    <figure>
      <figcaption><strong>B · Bold</strong><span>Dark with a bright lime accent. Feels modern, confident, a bit techy.</span></figcaption>
      <div class="phone"><iframe src="/?style=bold" title="Bold style preview" loading="lazy"></iframe></div>
      <a class="open" href="/?style=bold" target="_blank">Open full page →</a>
    </figure>
    <figure>
      <figcaption><strong>C · Warm</strong><span>Cream paper, elegant headings, centered. Feels friendly and personal.</span></figcaption>
      <div class="phone"><iframe src="/?style=warm" title="Warm style preview" loading="lazy"></iframe></div>
      <a class="open" href="/?style=warm" target="_blank">Open full page →</a>
    </figure>
  </div>
</body>
</html>
